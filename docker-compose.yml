services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pawwp
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d pawwp"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: postgres://user:password@db:5432/pawwp?sslmode=disable
      JWT_SECRET: your_super_secret_key
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
